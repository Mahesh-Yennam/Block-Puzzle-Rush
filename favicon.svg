<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="blockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#070913"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="url(#blockGrad)" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Tetromino Jewel Polyomino Blocks -->
  <!-- Top Left Block (Amber) -->
  <rect x="18" y="18" width="13" height="13" rx="3" fill="#f59e0b" stroke="#fde68a" stroke-width="1.5" filter="url(#blockGlow)"/>
  <!-- Top Right Block (Rose) -->
  <rect x="33" y="18" width="13" height="13" rx="3" fill="#f43f5e" stroke="#fecdd3" stroke-width="1.5" filter="url(#blockGlow)"/>
  <!-- Bottom Right Block (Purple) -->
  <rect x="33" y="33" width="13" height="13" rx="3" fill="#a855f7" stroke="#e9d5ff" stroke-width="1.5" filter="url(#blockGlow)"/>
  <!-- Bottom Left Block (Cyan) -->
  <rect x="18" y="33" width="13" height="13" rx="3" fill="#06b6d4" stroke="#a5f3fc" stroke-width="1.5" filter="url(#blockGlow)"/>
</svg>
